spring:
  application:
    name: geoji-backend
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:geoji}
    username: ${POSTGRES_USER:geoji}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
geoji:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:geoji-app}
  oauth:
    callback-base-url: ${OAUTH_CALLBACK_BASE_URL:http://localhost:8080}
    success-redirect-url: ${OAUTH_SUCCESS_REDIRECT_URL:http://localhost:3000/oauth/callback}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao-client-id: ${KAKAO_CLIENT_ID:}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET:}
    apple-client-id: ${APPLE_CLIENT_ID:}
    apple-team-id: ${APPLE_TEAM_ID:}
    apple-key-id: ${APPLE_KEY_ID:}
    apple-private-key-path: ${APPLE_PRIVATE_KEY_PATH:}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
